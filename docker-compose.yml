# OpenDealbook local-development infrastructure.
#
# The Supabase demo JWT secret and keys match the Supabase CLI defaults, so tests and
# tooling written against `supabase start` keep working.
#
# Production runs on Helm/Talos K8s (k8-infra repo); these compose services are the local
# equivalents only. None are wired into the app yet; this is infrastructure ahead of app
# wiring.
#
# --- Bringing it up ------------------------------------------------------------------
#   Core self-hosted stack:   docker compose --profile core up -d
#   Observability stack:      docker compose --profile observability up -d
#   Document parsing (OCR):   docker compose --profile docling up -d
#   Notifications (Novu):     docker compose --profile notifications up -d
#   Everything:               docker compose --profile core --profile observability --profile docling --profile notifications up -d
#
# The observability profile is a full Grafana LGTM + profiling stack fed by the OTel
# Collector: Logs=Loki, Traces=Tempo, Metrics=Prometheus, Profiles=Pyroscope, with
# blackbox-exporter for uptime probes and Grafana for dashboards + alerting. Apps send
# OTLP to the collector and push profiles to Pyroscope. Host ports come from the env var
# named on each service; the slot 0 defaults sit off the upstream defaults so the stack
# can coexist with another local LGTM stack. Grafana's datasources, dashboards, and alert
# rules are provisioned from infra/grafana. Bring it up with:
#   docker compose --profile observability up -d
# Nothing starts without a profile, so `docker compose up` on its own is a no-op; the
# heavy services are all profile-gated to keep a dev machine light.
#
# --- Running several copies (git worktrees) ------------------------------------------
# Every host port comes from an env var whose default is the slot 0 port, so each
# worktree runs its own copy of every profile side by side, under its own
# COMPOSE_PROJECT_NAME and port slot. Volumes are named per project; a fresh Supabase DB
# volume initializes from infra/supabase/schema.sql, then migrations and seed are
# applied on top.
# The dedicated Postgres instances here (temporal/nango/documenso) are internal to this
# network and are intentionally not published.

name: opendealbook

x-postgres: &postgres
  image: postgres:16.15-alpine
  restart: unless-stopped
  networks: [opendealbook]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 10s
    timeout: 5s
    retries: 5

networks:
  opendealbook:
    driver: bridge

volumes:
  temporal_postgres_data:
  nango_postgres_data:
  nango_redis_data:
  documenso_postgres_data:
  novu_mongo_data:
  novu_redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  pyroscope_data:
  docling_cache:
  supabase_db_data:
  supabase_storage_data:

x-supabase-keys:
  jwt-secret: &jwt-secret super-secret-jwt-token-with-at-least-32-characters-long
  anon-key: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  service-key: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  s3-access-key-id: &s3-access-key-id 625729a08b95bf1b7ff351a663f3a23c
  s3-access-key-secret: &s3-access-key-secret 850181e4652dd023b7a98c58ae0d2d34bd487ee0cc3254aed6eda37307425907

services:
  # --- Supabase -----------------------------------------------------------------------
  # Mirrors the Supabase CLI's local stack (images and settings) minus edge runtime,
  # analytics, imgproxy and the pooler.
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.158
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: *jwt-secret
      JWT_EXP: 3600
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./infra/supabase/schema.sql:/etc/postgresql.schema.sql:ro
    ports:
      - "${SUPABASE_DB_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.195.0
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_DB_MIGRATIONS_PATH: /usr/local/etc/auth/migrations
      GOTRUE_SITE_URL: http://localhost:${APP_PORT:-3000}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${APP_PORT:-3000},http://localhost:${APP_PORT:-3000}/auth/callback,http://localhost:${APP_PORT:-3000}/update-password
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_VALID_METHODS: HS256,RS256,ES256
      GOTRUE_JWT_VALIDMETHODS: HS256,RS256,ES256
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_APPLE_ENABLED: "false"
      GOTRUE_EXTERNAL_APPLE_EMAIL_OPTIONAL: "false"
      GOTRUE_EXTERNAL_APPLE_SKIP_NONCE_CHECK: "false"
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1/callback
      GOTRUE_EXTERNAL_WEB3_SOLANA_ENABLED: "false"
      GOTRUE_EXTERNAL_WEB3_ETHEREUM_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_MAILER_TEMPLATE_RELOADING_ENABLED: "true"
      GOTRUE_MAILER_URLPATHS_INVITE: http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1/verify
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: admin@email.com
      GOTRUE_SMTP_SENDER_NAME: Admin
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_SMS_MAX_FREQUENCY: 5s
      GOTRUE_SMS_OTP_EXP: 6000
      GOTRUE_SMS_OTP_LENGTH: 6
      GOTRUE_SMS_TEMPLATE: "Your code is {{ .Code }}"
      GOTRUE_PASSWORD_MIN_LENGTH: 6
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_PHONE_ENROLL_ENABLED: "false"
      GOTRUE_MFA_PHONE_VERIFY_ENABLED: "false"
      GOTRUE_MFA_WEB_AUTHN_ENROLL_ENABLED: "false"
      GOTRUE_MFA_WEB_AUTHN_VERIFY_ENABLED: "false"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 360000
      GOTRUE_RATE_LIMIT_SMS_SENT: 30
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: 30
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_VERIFY: 30
      GOTRUE_RATE_LIMIT_OTP: 30
      GOTRUE_RATE_LIMIT_WEB3: 30
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "false"
      GOTRUE_SECURITY_CAPTCHA_ENABLED: "false"
    command: ["auth"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.1
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_ADMIN_SERVER_PORT: 3001

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.69.0
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://supabase_storage_admin:postgres@db:5432/postgres
      ANON_KEY: *anon-key
      SERVICE_KEY: *service-key
      AUTH_JWT_SECRET: *jwt-secret
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /mnt
      FILE_SIZE_LIMIT: 314572800
      UPLOAD_FILE_SIZE_LIMIT: 52428800000
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: 5242880000
      SIGNED_UPLOAD_URL_EXPIRATION_TIME: 7200
      ENABLE_IMAGE_TRANSFORMATION: "false"
      TENANT_ID: stub
      GLOBAL_S3_BUCKET: stub
      STORAGE_S3_REGION: local
      TUS_URL_PATH: /storage/v1/upload/resumable
      S3_PROTOCOL_ENABLED: "true"
      S3_PROTOCOL_PREFIX: /storage/v1
      S3_PROTOCOL_ACCESS_KEY_ID: *s3-access-key-id
      S3_PROTOCOL_ACCESS_KEY_SECRET: *s3-access-key-secret
      VECTOR_ENABLED: "true"
      VECTOR_BUCKET_PROVIDER: pgvector
      VECTOR_STORE_MIGRATIONS_ENABLED: "true"
      VECTOR_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    volumes:
      - supabase_storage_data:/mnt
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  realtime:
    image: public.ecr.aws/supabase/realtime:v2.124.4
    profiles: [core]
    restart: unless-stopped
    networks:
      opendealbook:
        # Realtime takes its tenant from the Host header; Kong routes to this alias.
        aliases: [realtime-dev]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: *jwt-secret
      METRICS_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: EAx3IQ/wRG1v47ZD4NE4/9RzBI8Jmil3x0yhcW4V2NHBP6c2iPIzwjofi2Ep4HIG
      APP_NAME: realtime
      ERL_AFLAGS: -proto_dist inet_tcp
      RUN_JANITOR: "true"
      SEED_SELF_HOST: "true"
      MAX_HEADER_LENGTH: 4096
      DNS_NODES: "''"
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H Host:realtime-dev http://127.0.0.1:4000/api/ping"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_NGINX_WORKER_PROCESSES: 1
      KONG_PORT_MAPS: ${SUPABASE_API_PORT:-54321}:8000
    volumes:
      - ./infra/supabase/kong.yml:/home/kong/kong.yml:ro
    ports:
      - "${SUPABASE_API_PORT:-54321}:8000"

  studio:
    image: public.ecr.aws/supabase/studio:2026.08.10-sha-5b68af1
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://pg-meta:8080
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://127.0.0.1:${SUPABASE_API_PORT:-54321}
      SUPABASE_ANON_KEY: *anon-key
      SUPABASE_SERVICE_KEY: *service-key
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      SUPABASE_SECRET_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
      AUTH_JWT_SECRET: *jwt-secret
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER_READ_WRITE: postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: 1000
      S3_PROTOCOL_ACCESS_KEY_ID: *s3-access-key-id
      S3_PROTOCOL_ACCESS_KEY_SECRET: *s3-access-key-secret
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    ports:
      - "${SUPABASE_STUDIO_PORT:-54323}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node --eval=\"fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (!r.ok) throw new Error(r.status)})\""]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  pg-meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.97.0
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "node --eval=\"fetch('http://127.0.0.1:8080/health').then((r) => {if (!r.ok) throw new Error(r.status)})\""]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "${MAILPIT_UI_PORT:-54324}:8025"
      - "${MAILPIT_SMTP_PORT:-54325}:1025"
    healthcheck:
      test: ["CMD-SHELL", "/mailpit readyz"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s

  # --- Temporal (workflows) -----------------------------------------------------------
  temporal-postgres:
    <<: *postgres
    profiles: [core]
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_DB_NAME:-temporal}
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.7
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:2.54.1
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:${APP_PORT:-3000}}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Nango (integrations) -----------------------------------------------------------
  nango-postgres:
    <<: *postgres
    profiles: [core]
    environment:
      POSTGRES_USER: ${NANGO_DB_USER:-nango}
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      POSTGRES_DB: ${NANGO_DB_NAME:-nango}
    volumes:
      - nango_postgres_data:/var/lib/postgresql/data

  nango-redis:
    image: redis:7.4-alpine
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    volumes:
      - nango_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nango-server:
    image: nangohq/nango-server:hosted-0.71.10
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      nango-postgres:
        condition: service_healthy
      nango-redis:
        condition: service_healthy
    environment:
      # Local-dev default (base64 of 32 bytes). Override with `openssl rand -base64 32` anywhere but a local machine.
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:-b3BlbmRlYWxib29rLWxvY2FsLWRldi1uYW5nby1rZXk=}
      NANGO_DB_USER: ${NANGO_DB_USER:-nango}
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      NANGO_DB_HOST: nango-postgres
      NANGO_DB_PORT: 5432
      NANGO_DB_NAME: ${NANGO_DB_NAME:-nango}
      NANGO_DB_SSL: "false"
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:${NANGO_PORT:-3003}}
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:-admin}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:-admin}
      REDIS_URL: redis://nango-redis:6379
      SERVER_PORT: 3003
      TELEMETRY: "false"
      FLAG_SERVE_CONNECT_UI: "true"
    ports:
      - "${NANGO_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Gotenberg (DOCX -> PDF conversion) ---------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    ports:
      - "${GOTENBERG_PORT:-3009}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Documenso (e-sign) -------------------------------------------------------------
  documenso-postgres:
    <<: *postgres
    profiles: [core]
    environment:
      POSTGRES_USER: ${DOCUMENSO_DB_USER:-documenso}
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:-documenso}
      POSTGRES_DB: ${DOCUMENSO_DB_NAME:-documenso}
    volumes:
      - documenso_postgres_data:/var/lib/postgresql/data

  documenso:
    image: documenso/documenso:v2.18.0
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      documenso-postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXTAUTH_URL: ${DOCUMENSO_URL:-http://localhost:${DOCUMENSO_PORT:-3005}}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_URL:-http://localhost:${DOCUMENSO_PORT:-3005}}
      # Documenso runs its background jobs (emails, sealing, webhooks) by calling itself. Inside
      # the container it listens on PORT, not on the published host port in DOCUMENSO_URL.
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      # Documenso refuses webhook URLs that resolve to private addresses. Allow the app on the
      # host so a webhook to http://host.docker.internal:<port>/api/webhooks/documenso is sent.
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: ${DOCUMENSO_WEBHOOK_SSRF_BYPASS_HOSTS:-host.docker.internal}
      # These three have local-dev defaults. Override each with `openssl rand -base64 32` anywhere but a local machine.
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:-local-dev-documenso-nextauth-secret}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:-local-dev-documenso-encryption-key}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-local-dev-documenso-encryption-secondary-key}
      NEXT_PRIVATE_DATABASE_URL: postgres://${DOCUMENSO_DB_USER:-documenso}:${DOCUMENSO_DB_PASSWORD:-documenso}@documenso-postgres:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://${DOCUMENSO_DB_USER:-documenso}:${DOCUMENSO_DB_PASSWORD:-documenso}@documenso-postgres:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:-changeit}
      NEXT_PRIVATE_SMTP_TRANSPORT: ${DOCUMENSO_SMTP_TRANSPORT:-smtp-auth}
      NEXT_PRIVATE_SMTP_HOST: ${DOCUMENSO_SMTP_HOST:-mailpit}
      NEXT_PRIVATE_SMTP_PORT: ${DOCUMENSO_SMTP_PORT:-1025}
      NEXT_PRIVATE_SMTP_USERNAME: ${DOCUMENSO_SMTP_USERNAME:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${DOCUMENSO_SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${DOCUMENSO_SMTP_FROM_NAME:-OpenDealbook Local}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_SMTP_FROM_ADDRESS:-noreply@opendealbook.local}
    ports:
      - "${DOCUMENSO_PORT:-3005}:3000"
    # cert.p12 must exist before `up`; see infra/documenso/README.md to generate it.
    volumes:
      - ./infra/documenso:/opt/documenso
    # Webhooks reach the app on the host via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # --- Observability ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Accept Tempo's service-graph / span metrics via remote write.
      - --web.enable-remote-write-receiver
      # Store trace exemplars so Grafana can jump metrics -> traces.
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.4.11
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on: [prometheus, loki, tempo, pyroscope]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-13100}:3100"
    # No healthcheck: the image holds only the loki binary, with no shell or HTTP client.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on: [prometheus, loki, tempo]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-14317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-14318}:4318"
      - "${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    # Distroless image (no shell): probe by validating config with the collector binary.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 20s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.10.2
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # 3200 is Tempo's HTTP/query API for Grafana. The OTLP receivers (4317/4318) stay
    # internal; the collector forwards traces to tempo:4317 over the compose network.
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    # No healthcheck: the image holds only the tempo binary, with no shell or HTTP client.

  pyroscope:
    image: grafana/pyroscope:1.19.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command: ["-pyroscopedb.data-path=/data"]
    volumes:
      - pyroscope_data:/data
    ports:
      - "${PYROSCOPE_PORT:-4040}:4040"
    healthcheck:
      test: ["CMD", "/usr/bin/profilecli", "query", "series", "--url", "http://127.0.0.1:4040"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    ports:
      - "${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    # Probes reach the host-side web app via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9115/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Docling (document parsing / OCR) ----------------------------------------------
  docling-serve:
    image: quay.io/docling-project/docling-serve:v1.35.0
    profiles: [docling]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      HF_HOME: /models
    volumes:
      - docling_cache:/models
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Novu (notifications) -----------------------------------------------------------
  # Self-hosted Novu CE: api/worker/ws/dashboard plus an internal MongoDB (primary store)
  # and a dedicated novu-redis (BullMQ queues + cache; kept separate from nango-redis so
  # Novu's heavy queue traffic never collides with Nango). Mongo and Redis are internal
  # only, like the temporal/nango/documenso stores.
  # In-app notifications stay on the Supabase realtime path; Novu owns email and future
  # channels. Email transport is configured as a Novu integration in the dashboard; point
  # it at mailpit (mailpit:1025) for catchable local sends.
  novu-mongo:
    image: mongo:8.0.17
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOVU_MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${NOVU_MONGO_PASSWORD:-secret}
    volumes:
      - novu_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  novu-redis:
    image: redis:7.4-alpine
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    volumes:
      - novu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  novu-api:
    image: ghcr.io/novuhq/novu/api:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NOVU_NODE_ENV:-local}
      IS_SELF_HOSTED: "true"
      PORT: 3000
      API_ROOT_URL: ${NOVU_API_ROOT_URL:-http://localhost:3006}
      DISABLE_USER_REGISTRATION: ${NOVU_DISABLE_USER_REGISTRATION:-false}
      MONGO_URL: mongodb://${NOVU_MONGO_USER:-root}:${NOVU_MONGO_PASSWORD:-secret}@novu-mongo:27017/novu-db?authSource=admin
      MONGO_MAX_POOL_SIZE: "10"
      MONGO_MIN_POOL_SIZE: "5"
      MONGO_AUTO_CREATE_INDEXES: "true"
      REDIS_HOST: novu-redis
      REDIS_PORT: "6379"
      REDIS_CACHE_SERVICE_HOST: novu-redis
      REDIS_CACHE_SERVICE_PORT: "6379"
      # JWT_SECRET, STORE_ENCRYPTION_KEY (exactly 32 chars), and NOVU_SECRET_KEY have local-dev defaults.
      # Override them with generated values (e.g. `openssl rand -base64 32`) anywhere but a local machine.
      JWT_SECRET: ${NOVU_JWT_SECRET:-local-dev-novu-jwt-secret}
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:-local-dev-novu-store-key-32chars}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:-local-dev-novu-secret-key}
      IS_API_RATE_LIMITING_ENABLED: "false"
      IS_V2_ENABLED: "true"
      # Novu refuses bridge URLs that resolve to private addresses. Allow the app on the host so
      # the lender workflows sync from, and run against, http://host.docker.internal:<port>/api/novu.
      NOVU_SAFE_OUTBOUND_ALLOW: ${NOVU_SAFE_OUTBOUND_ALLOW:-host.docker.internal}
    ports:
      - "${NOVU_API_PORT:-3006}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/v1/health-check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NOVU_NODE_ENV:-local}
      IS_SELF_HOSTED: "true"
      PORT: 3004
      API_ROOT_URL: ${NOVU_API_ROOT_URL:-http://localhost:3006}
      MONGO_URL: mongodb://${NOVU_MONGO_USER:-root}:${NOVU_MONGO_PASSWORD:-secret}@novu-mongo:27017/novu-db?authSource=admin
      REDIS_HOST: novu-redis
      REDIS_PORT: "6379"
      REDIS_CACHE_SERVICE_HOST: novu-redis
      REDIS_CACHE_SERVICE_PORT: "6379"
      JWT_SECRET: ${NOVU_JWT_SECRET:-local-dev-novu-jwt-secret}
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:-local-dev-novu-store-key-32chars}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:-local-dev-novu-secret-key}
      # Novu refuses bridge URLs that resolve to private addresses. Allow the app on the host so
      # the lender workflows sync from, and run against, http://host.docker.internal:<port>/api/novu.
      NOVU_SAFE_OUTBOUND_ALLOW: ${NOVU_SAFE_OUTBOUND_ALLOW:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3004/v1/health-check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  novu-ws:
    image: ghcr.io/novuhq/novu/ws:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NOVU_NODE_ENV:-local}
      IS_SELF_HOSTED: "true"
      PORT: 3002
      MONGO_URL: mongodb://${NOVU_MONGO_USER:-root}:${NOVU_MONGO_PASSWORD:-secret}@novu-mongo:27017/novu-db?authSource=admin
      REDIS_HOST: novu-redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${NOVU_JWT_SECRET:-local-dev-novu-jwt-secret}
    ports:
      - "${NOVU_WS_PORT:-3007}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3002/v1/health-check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  novu-dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-api:
        condition: service_healthy
      novu-worker:
        condition: service_healthy
    environment:
      VITE_API_HOSTNAME: ${NOVU_API_ROOT_URL:-http://localhost:3006}
      VITE_WEBSOCKET_HOSTNAME: ${NOVU_WS_URL:-http://localhost:3007}
    ports:
      - "${NOVU_DASHBOARD_PORT:-3008}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
