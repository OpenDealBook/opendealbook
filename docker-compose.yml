# OpenDealbook local-development infrastructure.
#
# This file provisions the self-hosted services the platform depends on in local dev.
# It does NOT run Supabase (Postgres/Auth/Storage): Supabase is managed by the Supabase
# CLI. Start it separately from apps/web with `supabase start`.
#
# Object storage is Supabase Storage, part of the Supabase CLI stack; there is no MinIO
# here. It is S3-compatible and served from the local Supabase API on port 54321 under
# /storage/v1 (e.g. http://localhost:54321/storage/v1). App wiring points there.
#
# Production runs on Helm/Talos K8s (k8-infra repo); these compose services are the local
# equivalents only. None are wired into the app yet; this is infrastructure ahead of app
# wiring.
#
# --- Bringing it up ------------------------------------------------------------------
#   Core self-hosted stack:   docker compose --profile core up -d
#   Observability stack:      docker compose --profile observability up -d
#   Document parsing (OCR):   docker compose --profile docling up -d
#   Notifications (Novu):     docker compose --profile notifications up -d
#   Everything:               docker compose --profile core --profile observability --profile docling --profile notifications up -d
#
# The observability profile is a full Grafana LGTM + profiling stack fed by the OTel
# Collector: Logs=Loki, Traces=Tempo, Metrics=Prometheus, Profiles=Pyroscope, with
# blackbox-exporter for uptime probes and Grafana for dashboards + alerting. Apps send
# OTLP to the collector (localhost:4318) and push profiles to Pyroscope (localhost:4040).
# Grafana is at http://localhost:3001 with datasources, dashboards, and alert rules
# provisioned from infra/grafana. Bring it up with:
#   docker compose --profile observability up -d
# Nothing starts without a profile, so `docker compose up` on its own is a no-op; the
# heavy services are all profile-gated to keep a dev machine light.
#
# --- Coexisting with the Supabase CLI ------------------------------------------------
# `supabase start` runs its own Docker stack on host ports: API 54321, Postgres 54322,
# Studio 54323, Inbucket 54324. These live on Supabase's own docker network, not on the
# `opendealbook` network below. The two reach each other over the host:
#   - From a compose service TO Supabase: use host.docker.internal:54321 (API) or
#     host.docker.internal:54322 (Postgres). Each service that needs this is given an
#     `extra_hosts` mapping so host.docker.internal resolves on Linux as well as macOS.
#   - From Supabase Edge Functions / the app TO a compose service: use the published
#     localhost ports listed on each service below.
# The dedicated Postgres instances here (temporal/nango/documenso) are internal to this
# network and are intentionally not published, so they never clash with 54322.

name: opendealbook

x-postgres: &postgres
  image: postgres:16.15-alpine
  restart: unless-stopped
  networks: [opendealbook]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 10s
    timeout: 5s
    retries: 5

networks:
  opendealbook:
    driver: bridge

volumes:
  temporal_postgres_data:
  nango_postgres_data:
  nango_redis_data:
  documenso_postgres_data:
  novu_mongo_data:
  novu_redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  pyroscope_data:
  docling_cache:

services:
  # --- Temporal (workflows) -----------------------------------------------------------
  temporal-postgres:
    <<: *postgres
    profiles: [core]
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_DB_NAME:-temporal}
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.7
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:2.54.1
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8233:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Nango (integrations) -----------------------------------------------------------
  nango-postgres:
    <<: *postgres
    profiles: [core]
    environment:
      POSTGRES_USER: ${NANGO_DB_USER:-nango}
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      POSTGRES_DB: ${NANGO_DB_NAME:-nango}
    volumes:
      - nango_postgres_data:/var/lib/postgresql/data

  nango-redis:
    image: redis:7.4-alpine
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    volumes:
      - nango_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nango-server:
    image: nangohq/nango-server:hosted-0.71.10
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      nango-postgres:
        condition: service_healthy
      nango-redis:
        condition: service_healthy
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:?set NANGO_ENCRYPTION_KEY in .env}
      NANGO_DB_USER: ${NANGO_DB_USER:-nango}
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      NANGO_DB_HOST: nango-postgres
      NANGO_DB_PORT: 5432
      NANGO_DB_NAME: ${NANGO_DB_NAME:-nango}
      NANGO_DB_SSL: "false"
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:-admin}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:-admin}
      REDIS_URL: redis://nango-redis:6379
      SERVER_PORT: 3003
      TELEMETRY: "false"
      FLAG_SERVE_CONNECT_UI: "true"
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Gotenberg (DOCX -> PDF conversion) ---------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Documenso (e-sign) -------------------------------------------------------------
  documenso-postgres:
    <<: *postgres
    profiles: [core]
    environment:
      POSTGRES_USER: ${DOCUMENSO_DB_USER:-documenso}
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:-documenso}
      POSTGRES_DB: ${DOCUMENSO_DB_NAME:-documenso}
    volumes:
      - documenso_postgres_data:/var/lib/postgresql/data

  documenso:
    image: documenso/documenso:v2.18.0
    profiles: [core]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      documenso-postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXTAUTH_URL: ${DOCUMENSO_URL:-http://localhost:3005}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_URL:-http://localhost:3005}
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?set DOCUMENSO_NEXTAUTH_SECRET in .env}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?set DOCUMENSO_ENCRYPTION_KEY in .env}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?set DOCUMENSO_ENCRYPTION_SECONDARY_KEY in .env}
      NEXT_PRIVATE_DATABASE_URL: postgres://${DOCUMENSO_DB_USER:-documenso}:${DOCUMENSO_DB_PASSWORD:-documenso}@documenso-postgres:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://${DOCUMENSO_DB_USER:-documenso}:${DOCUMENSO_DB_PASSWORD:-documenso}@documenso-postgres:5432/${DOCUMENSO_DB_NAME:-documenso}
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:-changeit}
      NEXT_PRIVATE_SMTP_TRANSPORT: ${DOCUMENSO_SMTP_TRANSPORT:-smtp-auth}
      NEXT_PRIVATE_SMTP_HOST: ${DOCUMENSO_SMTP_HOST:-host.docker.internal}
      NEXT_PRIVATE_SMTP_PORT: ${DOCUMENSO_SMTP_PORT:-54325}
      NEXT_PRIVATE_SMTP_USERNAME: ${DOCUMENSO_SMTP_USERNAME:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${DOCUMENSO_SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${DOCUMENSO_SMTP_FROM_NAME:-OpenDealbook Local}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_SMTP_FROM_ADDRESS:-noreply@opendealbook.local}
    ports:
      - "3005:3000"
    # cert.p12 must exist before `up`; see infra/documenso/README.md to generate it.
    volumes:
      - ./infra/documenso:/opt/documenso
    # Reach a host-side SMTP catcher (e.g. Supabase Inbucket) via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # --- Observability ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Accept Tempo's service-graph / span metrics via remote write.
      - --web.enable-remote-write-receiver
      # Store trace exemplars so Grafana can jump metrics -> traces.
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.4.11
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on: [prometheus, loki, tempo, pyroscope]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on: [prometheus, loki, tempo]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    # Distroless image (no shell): probe by validating config with the collector binary.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 20s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.10.2
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # 3200 is Tempo's HTTP/query API for Grafana. The OTLP receivers (4317/4318) stay
    # internal; the collector forwards traces to tempo:4317 over the compose network.
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  pyroscope:
    image: grafana/pyroscope:1.19.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    command: ["-pyroscopedb.data-path=/data"]
    volumes:
      - pyroscope_data:/data
    ports:
      - "4040:4040"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4040/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [observability]
    restart: unless-stopped
    networks: [opendealbook]
    ports:
      - "9115:9115"
    # Probes reach the host-side web app via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9115/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Docling (document parsing / OCR) ----------------------------------------------
  docling-serve:
    image: quay.io/docling-project/docling-serve:v1.35.0
    profiles: [docling]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      HF_HOME: /models
    volumes:
      - docling_cache:/models
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Novu (notifications) -----------------------------------------------------------
  # Self-hosted Novu CE: api/worker/ws/dashboard plus an internal MongoDB (primary store)
  # and a dedicated novu-redis (BullMQ queues + cache; kept separate from nango-redis so
  # Novu's heavy queue traffic never collides with Nango). Mongo and Redis are internal
  # only, like the temporal/nango/documenso stores. Published host ports (api 3006, ws
  # 3007, dashboard 3008) avoid every other published port here.
  # In-app notifications stay on the Supabase realtime path; Novu owns email and future
  # channels. Email transport is configured as a Novu integration in the dashboard; point
  # it at Supabase Inbucket (host.docker.internal:54325) for catchable local sends.
  novu-mongo:
    image: mongo:8.0.17
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOVU_MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${NOVU_MONGO_PASSWORD:-secret}
    volumes:
      - novu_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  novu-redis:
    image: redis:7.4-alpine
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    volumes:
      - novu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  novu-api:
    image: ghcr.io/novuhq/novu/api:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NOVU_NODE_ENV:-local}
      IS_SELF_HOSTED: "true"
      PORT: 3000
      API_ROOT_URL: ${NOVU_API_ROOT_URL:-http://localhost:3006}
      DISABLE_USER_REGISTRATION: ${NOVU_DISABLE_USER_REGISTRATION:-false}
      MONGO_URL: mongodb://${NOVU_MONGO_USER:-root}:${NOVU_MONGO_PASSWORD:-secret}@novu-mongo:27017/novu-db?authSource=admin
      MONGO_MAX_POOL_SIZE: "10"
      MONGO_MIN_POOL_SIZE: "5"
      MONGO_AUTO_CREATE_INDEXES: "true"
      REDIS_HOST: novu-redis
      REDIS_PORT: "6379"
      REDIS_CACHE_SERVICE_HOST: novu-redis
      REDIS_CACHE_SERVICE_PORT: "6379"
      JWT_SECRET: ${NOVU_JWT_SECRET:?set NOVU_JWT_SECRET in .env}
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:?set a 32-char NOVU_STORE_ENCRYPTION_KEY in .env}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:?set NOVU_SECRET_KEY in .env}
      IS_API_RATE_LIMITING_ENABLED: "false"
      IS_V2_ENABLED: "true"
    ports:
      - "3006:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/v1/health-check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NOVU_NODE_ENV:-local}
      IS_SELF_HOSTED: "true"
      PORT: 3004
      API_ROOT_URL: ${NOVU_API_ROOT_URL:-http://localhost:3006}
      MONGO_URL: mongodb://${NOVU_MONGO_USER:-root}:${NOVU_MONGO_PASSWORD:-secret}@novu-mongo:27017/novu-db?authSource=admin
      REDIS_HOST: novu-redis
      REDIS_PORT: "6379"
      REDIS_CACHE_SERVICE_HOST: novu-redis
      REDIS_CACHE_SERVICE_PORT: "6379"
      JWT_SECRET: ${NOVU_JWT_SECRET:?set NOVU_JWT_SECRET in .env}
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:?set a 32-char NOVU_STORE_ENCRYPTION_KEY in .env}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:?set NOVU_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3004/v1/health-check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  novu-ws:
    image: ghcr.io/novuhq/novu/ws:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-mongo:
        condition: service_healthy
      novu-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NOVU_NODE_ENV:-local}
      IS_SELF_HOSTED: "true"
      PORT: 3002
      MONGO_URL: mongodb://${NOVU_MONGO_USER:-root}:${NOVU_MONGO_PASSWORD:-secret}@novu-mongo:27017/novu-db?authSource=admin
      REDIS_HOST: novu-redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${NOVU_JWT_SECRET:?set NOVU_JWT_SECRET in .env}
    ports:
      - "3007:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3002/v1/health-check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  novu-dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.19.0
    profiles: [notifications]
    restart: unless-stopped
    networks: [opendealbook]
    depends_on:
      novu-api:
        condition: service_healthy
      novu-worker:
        condition: service_healthy
    environment:
      VITE_API_HOSTNAME: ${NOVU_API_ROOT_URL:-http://localhost:3006}
      VITE_WEBSOCKET_HOSTNAME: ${NOVU_WS_URL:-http://localhost:3007}
    ports:
      - "3008:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
