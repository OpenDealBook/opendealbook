apiVersion: 1

groups:
  - orgId: 1
    name: opendealbook-core
    folder: OpenDealbook
    interval: 1m
    rules:
      - uid: service-down
        title: Service down
        condition: C
        for: 2m
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: min by (instance) (probe_success)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} probe_success is 0 (down for 2m)"

      - uid: high-error-rate
        title: High app error rate
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
        labels:
          severity: warning
        annotations:
          summary: "5xx error ratio above 5% for 5m"

      - uid: high-p95-latency
        title: High p95 latency
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        labels:
          severity: warning
        annotations:
          summary: "p95 HTTP server latency above 1s for 5m"
