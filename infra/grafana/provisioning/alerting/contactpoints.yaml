apiVersion: 1

# Local placeholder contact point. Production routing (PagerDuty, Slack, email) is a
# follow-up; this webhook simply gives the rules a valid destination in local dev.
contactPoints:
  - orgId: 1
    name: local-webhook
    receivers:
      - uid: local-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:9099/alerts
        disableResolveMessage: false
