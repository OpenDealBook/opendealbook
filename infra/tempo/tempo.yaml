# Tempo single-binary, local filesystem storage (local dev only).
# OTLP receivers are internal to this container on 4317/4318; the OTel Collector
# forwards traces to tempo:4317. These ports are intentionally not published to the
# host, so they do not clash with the collector's published 4317/4318.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

# Derives service-graph and span (RED) metrics from spans and remote-writes them to
# Prometheus, which powers the Traces dashboard and Grafana's service map / node graph.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
