name: build-image

# Builds the web image and the Temporal worker's dedicated image, and pushes
# them to ghcr.io/opendealbook/opendealbook and
# ghcr.io/opendealbook/opendealbook-worker respectively.
#
# Auth: the default GITHUB_TOKEN is used with `packages: write`. It can push to
# ghcr.io packages owned by the repository's org/user. If the ghcr package lives
# under a different owner (opendealbook) than this repository, replace the login
# password with a Personal Access Token (classic, scope `write:packages`) stored
# as the secret GHCR_PAT, and set REGISTRY_USER to that PAT's account.

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: web
            image: opendealbook/opendealbook
            dockerfile: Dockerfile
          - target: worker
            image: opendealbook/opendealbook-worker
            dockerfile: Dockerfile.worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
