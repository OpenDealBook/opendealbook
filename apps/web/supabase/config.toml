project_id = "tuckin"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
schema_paths = ["./schemas/*.sql"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/update-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local dev only: programmatic sign-up returns a session immediately. Production
# keeps confirmations on through its own hosted auth settings.
enable_confirmations = false
double_confirm_changes = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
